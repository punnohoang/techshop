name: CI/CD — Build & Deploy to GKE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  CLUSTER_NAME: techshop-cluster
  REGISTRY: asia-southeast1-docker.pkg.dev

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Test & Build
  # ─────────────────────────────────────────────
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests
        run: npm test
        working-directory: backend

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push Docker image lên Artifact Registry
  # ─────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write  # Workload Identity Federation

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Set image tag
        id: meta
        run: echo "tags=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/techshop/backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & Push backend image
        run: |
          docker build -t ${{ steps.meta.outputs.tags }} ./backend
          docker push ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────────
  # JOB 3: Deploy lên GKE
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.REGION }}

      - name: Deploy to GKE
        run: |
          # Cập nhật image tag mới
          kubectl set image deployment/techshop-backend \
            backend=${{ needs.build-push.outputs.image_tag }} \
            -n techshop

          # Chờ rollout hoàn thành
          kubectl rollout status deployment/techshop-backend -n techshop --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n techshop
          echo "✅ Deploy thành công!"