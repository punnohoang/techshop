# KHÔNG commit file này lên git!
# Tạo bằng lệnh:
#   kubectl apply -f k8s/01-secret.yaml -n techshop
#
# Hoặc dùng lệnh kubectl tạo trực tiếp:
#   kubectl create secret generic techshop-secret \
#     --from-literal=DATABASE_URL="postgresql://postgres:<password>@<CLOUD_SQL_PRIVATE_IP>:5432/techshop" \
#     --from-literal=CLOUDINARY_CLOUD_NAME="xxx" \
#     --from-literal=CLOUDINARY_API_KEY="xxx" \
#     --from-literal=CLOUDINARY_API_SECRET="xxx" \
#     -n techshop

apiVersion: v1
kind: Secret
metadata:
  name: techshop-secret
  namespace: techshop
type: Opaque
stringData:
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@CLOUD_SQL_IP:5432/techshop"
  CLOUDINARY_CLOUD_NAME: "CHANGE_ME"
  CLOUDINARY_API_KEY: "CHANGE_ME"
  CLOUDINARY_API_SECRET: "CHANGE_ME"
